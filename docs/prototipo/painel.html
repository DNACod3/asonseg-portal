<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASONSEG — Protótipo: Painel da área logada (por papel)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Nunito:ital,wght@0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    /* ========== DESIGN SYSTEM (mesmos tokens de index.html) ========== */
    :root {
      --color-primary: #2563EB;
      --color-secondary: #3B82F6;
      --color-cta: #F97316;
      --color-cta-hover: #EA580C;
      --color-background: #F8FAFC;
      --color-surface: #FFFFFF;
      --color-text: #1E293B;
      --color-text-light: #64748B;
      --color-border: #E2E8F0;
      --color-white: #FFFFFF;
      --color-success: #10B981;
      --color-danger: #EF4444;
      --color-muted: #F1F5F9;
      --space-xs: 4px;  --space-sm: 8px;  --space-md: 16px;
      --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.08), 0 4px 6px rgba(0,0,0,0.04);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
      --sidebar-w: 248px;
      --sidebar-w-collapsed: 68px;
    }
    [data-theme="dark"] {
      --color-primary: #3B82F6;
      --color-secondary: #60A5FA;
      --color-cta: #FB923C;
      --color-cta-hover: #F97316;
      --color-background: #0F172A;
      --color-surface: #1E293B;
      --color-text: #F1F5F9;
      --color-text-light: #94A3B8;
      --color-border: #334155;
      --color-white: #1E293B;
      --color-success: #34D399;
      --color-danger: #F87171;
      --color-muted: #1A2332;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.3);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.4), 0 4px 6px rgba(0,0,0,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--color-background);
      color: var(--color-text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { font-family: 'Nunito', sans-serif; line-height: 1.25; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    /* ========== BOTÕES ========== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm);
      padding: 10px 18px; border-radius: var(--radius-sm); border: 1.5px solid transparent;
      font-size: 0.875rem; font-weight: 600; white-space: nowrap;
      transition: all 0.18s ease; background: transparent; color: var(--color-text);
    }
    .btn-primary { background: var(--color-primary); color: #fff; }
    .btn-primary:hover { background: var(--color-secondary); }
    .btn-cta { background: var(--color-cta); color: #fff; }
    .btn-cta:hover { background: var(--color-cta-hover); }
    .btn-outline { border-color: var(--color-border); color: var(--color-text-light); }
    .btn-outline:hover { border-color: var(--color-secondary); color: var(--color-secondary); }
    .btn-ghost { color: var(--color-primary); }
    .btn-ghost:hover { background: rgba(37,99,235,0.08); }
    .btn-danger { border-color: var(--color-danger); color: var(--color-danger); }
    .btn-danger:hover { background: var(--color-danger); color: #fff; }
    .btn-xs { padding: 5px 11px; font-size: 0.78rem; border-radius: 6px; }
    .btn svg { width: 16px; height: 16px; }

    /* ========== BADGES ========== */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap;
    }
    .badge-blue   { background: #DBEAFE; color: #1D4ED8; }
    .badge-orange { background: #FFEDD5; color: #C2410C; }
    .badge-green  { background: #D1FAE5; color: #047857; }
    .badge-gray   { background: #F1F5F9; color: #475569; }
    .badge-red    { background: #FEE2E2; color: #B91C1C; }
    [data-theme="dark"] .badge-blue   { background: rgba(59,130,246,0.15);  color: #60A5FA; }
    [data-theme="dark"] .badge-orange { background: rgba(251,146,60,0.15);  color: #FB923C; }
    [data-theme="dark"] .badge-green  { background: rgba(52,211,153,0.15);  color: #34D399; }
    [data-theme="dark"] .badge-gray   { background: rgba(148,163,184,0.12); color: #94A3B8; }
    [data-theme="dark"] .badge-red    { background: rgba(248,113,113,0.15); color: #F87171; }

    /* ========== BARRA DE PROTÓTIPO (não faz parte do produto) ========== */
    .proto-bar {
      position: sticky; top: 0; z-index: 200;
      background: #0F172A; color: #E2E8F0;
      padding: var(--space-sm) var(--space-lg);
      display: flex; align-items: center; gap: var(--space-md); flex-wrap: wrap;
      border-bottom: 1px solid #1E293B;
    }
    .proto-bar .proto-label {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: #94A3B8; display: flex; align-items: center; gap: 6px;
    }
    .proto-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .proto-chip {
      padding: 5px 12px; border-radius: 999px; border: 1px solid #334155;
      background: transparent; color: #CBD5E1; font-size: 0.78rem; font-weight: 600;
      transition: all 0.15s ease;
    }
    .proto-chip:hover { border-color: #60A5FA; color: #fff; }
    .proto-chip.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
    .proto-bar .spacer { flex: 1; }
    .proto-bar a.proto-link { font-size: 0.78rem; color: #94A3B8; text-decoration: underline; }

    /* ========== CASCA DA ÁREA LOGADA (espelha USP-061/064/065) ========== */
    .shell { display: flex; min-height: calc(100vh - 46px); }

    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: var(--color-surface); border-right: 1px solid var(--color-border);
      display: flex; flex-direction: column;
      transition: width 0.2s ease;
      position: sticky; top: 46px; height: calc(100vh - 46px);
    }
    .sidebar.collapsed { width: var(--sidebar-w-collapsed); }
    .sidebar-brand {
      display: flex; align-items: center; gap: var(--space-sm);
      padding: var(--space-md); border-bottom: 1px solid var(--color-border); min-height: 64px;
    }
    .logo-icon {
      width: 34px; height: 34px; flex-shrink: 0; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.05rem;
    }
    .sidebar-brand .brand-text { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; }
    .sidebar-nav { padding: var(--space-sm); display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
    .snav-group {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--color-text-light); padding: var(--space-md) var(--space-sm) var(--space-xs);
    }
    .snav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 9px var(--space-sm); border-radius: var(--radius-sm);
      color: var(--color-text-light); font-size: 0.875rem; font-weight: 500;
      transition: all 0.15s ease; white-space: nowrap; overflow: hidden;
    }
    .snav-item:hover { background: var(--color-muted); color: var(--color-text); }
    .snav-item.active { background: rgba(37,99,235,0.1); color: var(--color-primary); font-weight: 600; }
    .snav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .sidebar.collapsed .snav-item span, .sidebar.collapsed .snav-group,
    .sidebar.collapsed .brand-text { display: none; }
    .sidebar-foot { padding: var(--space-sm); border-top: 1px solid var(--color-border); }

    .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 46px; z-index: 100;
      background: var(--color-surface); border-bottom: 1px solid var(--color-border);
      min-height: 64px; padding: 0 var(--space-lg);
      display: flex; align-items: center; gap: var(--space-md);
    }
    .icon-btn {
      width: 38px; height: 38px; border-radius: var(--radius-sm);
      border: 1px solid var(--color-border); background: transparent; color: var(--color-text-light);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .icon-btn:hover { border-color: var(--color-secondary); color: var(--color-secondary); }
    .icon-btn svg { width: 18px; height: 18px; }
    .crumb { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--color-text-light); min-width: 0; }
    .crumb strong { color: var(--color-text); font-weight: 600; }
    .crumb .sep { opacity: 0.5; }
    .topbar .spacer { flex: 1; }
    .profile-btn {
      display: flex; align-items: center; gap: var(--space-sm);
      padding: 6px 10px 6px 6px; border-radius: 999px;
      border: 1px solid var(--color-border); background: transparent; color: var(--color-text);
    }
    .profile-btn:hover { border-color: var(--color-secondary); }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, rgba(37,99,235,0.18), rgba(37,99,235,0.08));
      color: var(--color-primary); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.75rem;
    }
    .profile-meta { text-align: left; line-height: 1.15; }
    .profile-meta .pname { font-size: 0.82rem; font-weight: 600; display: block; }
    .profile-meta .prole { font-size: 0.7rem; color: var(--color-text-light); display: block; }

    /* ========== CONTEÚDO DO PAINEL ========== */
    .content { padding: var(--space-xl) var(--space-lg) var(--space-2xl); max-width: 1280px; width: 100%; }
    .page-head { margin-bottom: var(--space-lg); }
    .page-head h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .page-head p { color: var(--color-text-light); font-size: 0.92rem; }

    /* Ações rápidas (topo do painel) */
    .quick-actions {
      display: flex; gap: var(--space-sm); flex-wrap: wrap;
      margin-bottom: var(--space-lg);
    }

    /* Indicadores */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-md); margin-bottom: var(--space-lg);
    }
    .kpi {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: var(--space-md) var(--space-lg);
      box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: var(--space-md);
    }
    .kpi-icon {
      width: 42px; height: 42px; border-radius: var(--radius-sm); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(37,99,235,0.1); color: var(--color-primary);
    }
    .kpi-icon svg { width: 20px; height: 20px; }
    .kpi-icon.tone-orange { background: rgba(249,115,22,0.12); color: var(--color-cta); }
    .kpi-icon.tone-green  { background: rgba(16,185,129,0.12); color: var(--color-success); }
    .kpi-icon.tone-gray   { background: var(--color-muted);    color: var(--color-text-light); }
    .kpi-val { font-family: 'Nunito', sans-serif; font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
    .kpi-lbl { font-size: 0.78rem; color: var(--color-text-light); font-weight: 500; }

    /* Grid de cards */
    .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: var(--space-lg); align-items: start; }
    .dash-grid.single { grid-template-columns: 1fr; }

    .dcard {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden;
      display: flex; flex-direction: column;
    }
    .dcard-head {
      padding: var(--space-md) var(--space-lg);
      border-bottom: 1px solid var(--color-border);
      display: flex; align-items: flex-start; gap: var(--space-sm);
    }
    .dcard-head h3 { font-size: 1rem; }
    .dcard-head p { font-size: 0.78rem; color: var(--color-text-light); }
    .dcard-head .spacer { flex: 1; }

    .drow {
      display: flex; align-items: center; gap: var(--space-md);
      padding: 12px var(--space-lg); border-bottom: 1px solid var(--color-border);
    }
    .drow:last-of-type { border-bottom: none; }
    .drow:hover { background: var(--color-muted); }
    .drow-mark {
      width: 36px; height: 36px; border-radius: var(--radius-sm); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--color-muted); color: var(--color-text-light);
      font-size: 0.72rem; font-weight: 700;
    }
    .drow-mark svg { width: 17px; height: 17px; }
    .drow-body { flex: 1; min-width: 0; }
    .drow-title { font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; }
    .drow-sub { font-size: 0.78rem; color: var(--color-text-light); }
    .drow-meta { font-size: 0.72rem; color: var(--color-text-light); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
    .drow-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }

    .dcard-foot {
      padding: 12px var(--space-lg); border-top: 1px solid var(--color-border);
      background: var(--color-muted);
      display: flex; align-items: center; gap: var(--space-sm);
    }
    .dcard-foot .spacer { flex: 1; }
    .dcard-foot .hint { font-size: 0.75rem; color: var(--color-text-light); }

    /* Card de contadores (Cliente — prestadores por tipo de serviço) */
    .counter-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: var(--space-sm); padding: var(--space-lg);
    }
    .counter {
      border: 1px solid var(--color-border); border-radius: var(--radius-md);
      padding: var(--space-md); text-align: left; background: transparent;
      transition: all 0.15s ease; display: block; width: 100%;
    }
    .counter:hover { border-color: var(--color-primary); box-shadow: var(--shadow-md); }
    .counter .cval { font-family: 'Nunito', sans-serif; font-size: 1.45rem; font-weight: 800; color: var(--color-primary); line-height: 1.1; }
    .counter .clbl { font-size: 0.82rem; font-weight: 600; color: var(--color-text); }
    .counter .chint { font-size: 0.72rem; color: var(--color-text-light); }

    /* Estado vazio */
    .dempty { padding: var(--space-xl) var(--space-lg); text-align: center; color: var(--color-text-light); font-size: 0.88rem; }

    /* Nota de decisão de dono */
    .note {
      border: 1px solid var(--color-border); border-left: 4px solid var(--color-cta);
      background: var(--color-surface); border-radius: var(--radius-md);
      padding: var(--space-md) var(--space-lg); margin-bottom: var(--space-lg);
      font-size: 0.85rem; color: var(--color-text-light);
    }
    .note strong { color: var(--color-text); }

    /* ========== RESPONSIVO ========== */
    @media (max-width: 1024px) {
      .sidebar { display: none; }
      .dash-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .content { padding: var(--space-lg) var(--space-md) 96px; }
      .topbar { padding: 0 var(--space-md); }
      .drow { flex-wrap: wrap; }
      .drow-actions { width: 100%; justify-content: flex-start; padding-left: 52px; }
      .profile-meta { display: none; }
      .dash-grid { grid-template-columns: 1fr; }
    }
    /* Bottom tab bar (mobile — espelha USP-062) */
    .bottom-tabs { display: none; }
    @media (max-width: 1024px) {
      .bottom-tabs {
        display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 150;
        background: var(--color-surface); border-top: 1px solid var(--color-border);
        padding: 6px 4px; padding-bottom: max(6px, env(safe-area-inset-bottom));
      }
      .btab {
        flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: 6px 2px; color: var(--color-text-light); font-size: 0.66rem; font-weight: 600;
        background: transparent; border: none; border-radius: var(--radius-sm);
      }
      .btab.active { color: var(--color-primary); }
      .btab svg { width: 20px; height: 20px; }
    }
  </style>
</head>
<body>

  <!-- ============ BARRA DE PROTÓTIPO (fora do produto) ============ -->
  <div class="proto-bar">
    <span class="proto-label">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 0 1-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 0 1 4.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0 1 12 15a9.065 9.065 0 0 0-6.23-.693L5 14.5m14.8.8 1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0 1 12 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5"/></svg>
      Protótipo · Painel da área logada
    </span>
    <span class="proto-chips" id="roleChips"></span>
    <span class="spacer"></span>
    <button class="proto-chip" onclick="toggleTheme()">Tema</button>
    <a class="proto-link" href="index.html">← Protótipo público</a>
  </div>

  <!-- ============ CASCA ============ -->
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="logo-icon">A</div>
        <span class="brand-text">ASONSEG</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav" aria-label="Navegação principal"></nav>
      <div class="sidebar-foot">
        <button class="snav-item" style="width:100%;border:none;background:transparent;" onclick="toggleSidebar()">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
          <span>Recolher menu</span>
        </button>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn" onclick="toggleSidebar()" aria-label="Alternar menu lateral">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
        </button>
        <div class="crumb">
          <span>ASONSEG</span><span class="sep">/</span><strong>Início</strong>
        </div>
        <span class="spacer"></span>
        <button class="profile-btn" aria-label="Menu de perfil">
          <span class="avatar" id="avatarInitials">MS</span>
          <span class="profile-meta">
            <span class="pname" id="profileName">Maria Silva</span>
            <span class="prole" id="profileRole">Candidato(a)</span>
          </span>
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
        </button>
      </header>

      <main class="content" id="content"></main>
    </div>
  </div>

  <nav class="bottom-tabs" id="bottomTabs" aria-label="Navegação primária"></nav>

<script>
// =====================================================================
// ÍCONES
// =====================================================================

// =====================================================================
// RENDER
// =====================================================================
let currentRole = 'CANDIDATE';

function renderChips() {
  document.getElementById('roleChips').innerHTML = Object.entries(ROLES).map(([k, r]) =>
    `<button class="proto-chip ${k === currentRole ? 'active' : ''}" onclick="setRole('${k}')">${r.label}</button>`
  ).join('');
}

function renderSidebar(r) {
  document.getElementById('sidebarNav').innerHTML = r.nav.map(item =>
    item.g
      ? `<div class="snav-group">${item.g}</div>`
      : `<a class="snav-item ${item.active ? 'active' : ''}" href="#">${svg(I[item.icon])}<span>${item.label}</span></a>`
  ).join('');

  document.getElementById('bottomTabs').innerHTML = r.tabs.map(t =>
    `<button class="btab ${t.active ? 'active' : ''}">${svg(I[t.icon], 20)}<span>${t.label}</span></button>`
  ).join('');
}

function renderMark(mark) {
  return I[mark] ? svg(I[mark], 17) : mark;
}

function renderRow(row) {
  const badge = row.badge ? `<span class="badge badge-${row.badge.k}">${row.badge.t}</span>` : '';
  const meta = (row.meta || []).map(m => `<span>${m}</span>`).join('');
  const actions = (row.actions || []).map(a => `<button class="btn ${a.v} btn-xs">${a.l}</button>`).join('');
  return `
    <div class="drow">
      <div class="drow-mark">${renderMark(row.mark)}</div>
      <div class="drow-body">
        <div class="drow-title">${row.title}${badge}</div>
        <div class="drow-sub">${row.sub}</div>
        ${meta ? `<div class="drow-meta">${meta}</div>` : ''}
      </div>
      ${actions ? `<div class="drow-actions">${actions}</div>` : ''}
    </div>`;
}

function renderCard(card) {
  const body = card.kind === 'counters'
    ? `<div class="counter-grid">${card.counters.map(c => `
        <button class="counter">
          <div class="cval">${c.val}</div>
          <div class="clbl">${c.lbl}</div>
          <div class="chint">${c.hint}</div>
        </button>`).join('')}</div>`
    : (card.rows && card.rows.length
        ? card.rows.map(renderRow).join('')
        : `<div class="dempty">Nada por aqui ainda.</div>`);

  return `
    <section class="dcard">
      <div class="dcard-head">
        <div class="kpi-icon" style="width:34px;height:34px;">${svg(I[card.icon], 17)}</div>
        <div>
          <h3>${card.title}</h3>
          <p>${card.sub}</p>
        </div>
      </div>
      ${body}
      <div class="dcard-foot">
        <button class="btn btn-ghost btn-xs">${card.foot.label} →</button>
        <span class="spacer"></span>
        <span class="hint">${card.foot.hint}</span>
      </div>
    </section>`;
}

function renderDashboard() {
  const r = ROLES[currentRole];

  document.getElementById('profileName').textContent = r.person;
  document.getElementById('profileRole').textContent = r.label;
  document.getElementById('avatarInitials').textContent = r.initials;

  renderChips();
  renderSidebar(r);

  document.getElementById('content').innerHTML = `
    <div class="page-head">
      <h1>Olá, ${r.person.split(' ')[0]}</h1>
      <p>${r.greeting}</p>
    </div>

    ${r.note ? `<div class="note"><strong>Nota de RBAC (protótipo):</strong> ${r.note}</div>` : ''}

    <div class="quick-actions">
      ${r.quick.map(q => `<button class="btn ${q.variant}">${svg(I[q.icon], 16)}${q.label}</button>`).join('')}
    </div>

    <div class="kpi-grid">
      ${r.kpis.map(k => `
        <div class="kpi">
          <div class="kpi-icon ${k.tone}">${svg(I[k.icon], 20)}</div>
          <div>
            <div class="kpi-val">${k.val}</div>
            <div class="kpi-lbl">${k.lbl}</div>
          </div>
        </div>`).join('')}
    </div>

    <div class="dash-grid">
      ${r.cards.map(renderCard).join('')}
    </div>`;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setRole(role) {
  currentRole = role;
  renderDashboard();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('asonseg-theme', isDark ? 'light' : 'dark');
}
(function () {
  const saved = localStorage.getItem('asonseg-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.setAttribute('data-theme', 'dark');
})();

renderDashboard();
</script>
</body>
</html>
